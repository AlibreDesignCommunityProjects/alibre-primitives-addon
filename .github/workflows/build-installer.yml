name: Build Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Build add-on
      run: dotnet build source/Plugins/ADCP.Tools.Primitives/ADCP.Tools.Primitives.vbproj -c Debug -f net481
    - name: Setup Inno Setup
      run: |
        Invoke-WebRequest -Uri "https://files.jrsoftware.org/is/6/innosetup-6.2.2.exe" -OutFile "innosetup.exe"
        Start-Process -FilePath "innosetup.exe" -ArgumentList "/VERYSILENT", "/NORESTART" -Wait
        echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
    - name: Build installer
      working-directory: source
      run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "alibre-primitives-addon.iss"'
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: alibre-primitives-addon-installer
        path: source/installer/*.exe
    - name: Create release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: source/installer/*.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
